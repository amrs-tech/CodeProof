[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codeproof"
version = "0.1.0"
description = "Bounded autonomous repository review and verified remediation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.7,<3",
  "langgraph>=1.0,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.3,<1",
  "httpx>=0.28,<1",
  "ruff>=0.11,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<8"]

[tool.setuptools.packages.find]
include = ["codeproof*"]

[tool.setuptools.package-data]
codeproof = ["static/*", "sql/*.sql"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["examples/fragile-python", "tests/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
markers = ["integration: requires PostgreSQL with pgvector", "sandbox: requires Docker"]
